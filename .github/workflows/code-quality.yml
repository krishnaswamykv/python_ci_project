name: Code Quality

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: |
          pip install pycodestyle

      - name: Run PEP8 Check
        run: |
          pycodestyle . > pycodestyle-report.txt || true

      - name: Comment Violations on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (fs.existsSync('pycodestyle-report.txt')) {

              const report = fs.readFileSync(
                'pycodestyle-report.txt',
                'utf8'
              );

              if (report.trim().length > 0) {

                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body:
                  "## PEP8 Violations\n\n```text\n" +
                  report +
                  "\n```"
                });
              }
            }

      - name: Check Length and Docstrings
        run: |
          python scripts/check_quality.py
